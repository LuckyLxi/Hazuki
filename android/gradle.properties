org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
android.ndk.suppressMinSdkVersionError=21

# Windows 下 Kotlin 增量编译在跨盘符（项目盘符与 Pub/Gradle 缓存盘符不同）时可能触发缓存相对路径异常
kotlin.incremental=false
kotlin.incremental.android=false
# Flutter 3.44 still uses legacy Android DSL internals while warning on explicit
# KGP usage. Keep these opt-outs until Flutter's AGP 9/new DSL path is stable.
android.builtInKotlin=false
android.newDsl=false
