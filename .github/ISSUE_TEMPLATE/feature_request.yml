name: 功能请求
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过已有 issue，确认没有重复建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 这个功能请求是为了解决什么问题？
      placeholder: 例如：现在阅读时无法 xxx，导致 xxx。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方案
      description: 描述你希望 Hazuki 如何处理这个问题。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 如果你有其他可接受的方案，可以写在这里。
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 截图、参考链接或其他背景信息。
    validations:
      required: false
