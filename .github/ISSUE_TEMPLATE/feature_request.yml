
name: 功能请求
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 请描述你希望添加或改进的功能。
      placeholder: 我希望能够……
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息（可选）
      description: 可以提供截图、参考链接或其他说明。
    validations:
      required: false
