name: Bug 反馈
description: 报告 Hazuki 使用中遇到的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过已有 issue，确认这不是重复问题
          required: true
        - label: 我使用的是最新版本
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚描述你遇到的问题。
      placeholder: 例如：打开某个漫画详情页时闪退。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供尽量稳定、完整的复现步骤。
      placeholder: |
        1. 打开 App
        2. 搜索 xxx
        3. 点击 xxx
        4. 出现错误
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App 版本
      placeholder: 例如：1.2.3
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android 版本
      placeholder: 例如：Android 14
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: 例如：Pixel 8 / Xiaomi 14
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志、截图或录屏
      description: 如果有崩溃日志、截图或录屏，请粘贴或上传。
    validations:
      required: false
