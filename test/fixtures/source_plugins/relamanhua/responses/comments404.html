<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name=viewport content="width=device-width,height=device-height,initial-scale=1,user-scalable=no,minimum-scale=1,maximum-scale=2,viewport-fit=cover">
    <title>服務器升級中</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            min-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #993d3d;
        }

        .source {
            padding: 24px;
        }

        .source>div {
            display: block;
            unicode-bidi: isolate;
        }

        .card,
        .shadow {
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, .1);
        }

        .card {
            width: 480px;
            border-radius: 4px;
            border: 1px solid #ebeef5;
            background-color: #fff;
            overflow: hidden;
            transition: .3s;
            
        }

        .cardHeader {
            padding: 18px 20px;
            border-bottom: 1px solid #ebeef5;
            box-sizing: border-box;
        }

        .cardBody {
            padding: 20px;
            
        }

        p {
            text-indent: 2em;
        }

        .cardBody img{
            width: 50%;
            display: block;
            margin: 0 auto;
        }

        @media screen and (max-device-width: 500px) {
            .source {
                width: 80%;                   
            }
            .card {
                width: 100%;
                margin: 0;
            }
        }
    </style>
</head>

<body>
    <div class="source">
        <div>
            <div class="card shadow">
                <div class="cardHeader">搬遷維護中</div>
                <div class="cardBody">
                    <p>
                        我們在搬遷服務器，規避無休止投訴過程中，近幾日會間歇出現部分功能停止或訪問中斷
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>


</html>
